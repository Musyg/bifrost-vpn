[package]
name = "bifrost-coquille"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Logique de la coquille graphique, sans fenetre: etat et commandes du daemon par l'IPC verifie, vue pure, garde d'elevation"

[dependencies]
bifrost-core.workspace = true
bifrost-ipc.workspace = true
serde = { workspace = true }
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Meme version que bifrost-ipc: la mesure de l'elevation lit le jeton du
# processus.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
] }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true }

# Les recettes Windows posent elles-memes le descripteur du pipe de leur faux
# serveur (proprietaire et DACL), comme les recettes de bifrost-ipc; celle du
# vrai serveur lit le niveau d'integrite et le proprietaire par defaut du
# jeton de son processus, et y pose les Administrateurs. Celle du groupe
# d'acces cree sur le runner jetable un groupe et deux comptes locaux, au mot
# de passe tire par le systeme, et emprunte leurs jetons.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_NetManagement",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[lints]
workspace = true
