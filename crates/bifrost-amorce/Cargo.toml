[package]
name = "bifrost-amorce"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Recuperation multi-canal des profils signes"

[dependencies]
# Revision amont avec RustCrypto corrige; conserver le format age existant.
age = { git = "https://github.com/str4d/rage", rev = "b5b68c4f4f7ea5c368bc060f6fe0237549c3a13f", default-features = false }
base64.workspace = true
getrandom = "0.4"
bifrost-coffre.workspace = true
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "rustls-webpki-roots"] }
# aws-lc-rs plutot que ring: ring porte RUSTSEC-2025-0007 (non maintenu, repris
# par l'equipe rustls pour la seule securite), et aws-lc-rs est le fournisseur
# par defaut de rustls. Mesure le 19 aout 2026: il se construit sur dev-windows
# SANS cmake ni nasm, contrairement a ce que le handoff affirmait.
# `prefer-post-quantum` met l'echange hybride X25519MLKEM768 en tete du
# ClientHello, avec sa part; sans elle il venait en dernier et sans part. Le
# repli classique qui va avec est dans `src/toile.rs`. Les features s'unifient:
# la sonde d'inspection du client est concernee de la meme facon.
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "tls12", "prefer-post-quantum"] }
aws-lc-rs = { version = "1", features = ["prebuilt-nasm"] }

[dev-dependencies]
minisign = "0.9"

[lints]
workspace = true
