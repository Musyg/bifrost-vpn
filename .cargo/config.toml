# Durcissement de compilation des binaires du depot.
#
# Control Flow Guard sous Windows (MSVC). rustc ne l'active pas de lui-meme
# (`-C control-flow-guard`, defaut `no`). Le reste est deja pose sans rien
# demander, mesure le 01/10/2026 sur les binaires `--release` avant ce
# fichier: ASLR 64 bits et DEP sous Windows (DYNAMIC_BASE, HIGH_ENTROPY_VA,
# NX_COMPAT), PIE, RELRO complet et pile non executable sous Linux. Rien n'est
# donc ajoute pour Linux, ou ces tables ne s'appliquent pas.
#
# CET, pile fantome, sous Windows x64: `/CETCOMPAT` marque l'image compatible
# (bit IMAGE_DLLCHARACTERISTICS_EX_CET_COMPAT, dans l'entree de type 20 du
# repertoire de debogage). rustc 1.98.0 n'a pas d'option pour cela, d'ou le
# drapeau de l'editeur de liens. Il est dans sa propre table, limitee a x86_64:
# la documentation de Microsoft ne le donne que pour x64. cargo joint les
# drapeaux de toutes les tables de cible qui correspondent. Le marquage ne
# protege que sur un processeur qui porte la pile fantome et un Windows qui
# l'applique; ailleurs il est sans effet.
#
# Ce que ce reglage ne couvre PAS:
# - la bibliotheque standard est livree precompilee sans CFG; ses appels
#   indirects ne sont pas controles (seul `-Z build-std`, sur une chaine
#   nightly, la recompilerait);
# - la protection de pile de rustc (`-Z stack-protector`) n'existe que sur une
#   chaine nightly: elle n'est pas posee;
# - cargo ignore ces tables des que RUSTFLAGS ou CARGO_ENCODED_RUSTFLAGS est
#   defini, meme a vide, et ignore aussi `build.rustflags` d'une configuration
#   personnelle tant qu'une de ces tables s'applique;
# - cargo ne lit ce fichier que s'il est lance depuis le depot ou un de ses
#   sous-repertoires: pas avec `--manifest-path` depuis ailleurs, pas par
#   `cargo install` sans `--path`.
#
# Garde: `crates/bifrost-daemon/tests/durcissement_binaire.rs` lit les
# en-tetes de son propre executable, construit avec les memes drapeaux, et,
# dans la CI, ceux des binaires livres construits en `--release`.
[target.'cfg(all(target_os = "windows", target_env = "msvc"))']
rustflags = ["-C", "control-flow-guard=checks"]

[target.'cfg(all(target_os = "windows", target_env = "msvc", target_arch = "x86_64"))']
rustflags = ["-C", "link-arg=/CETCOMPAT"]
