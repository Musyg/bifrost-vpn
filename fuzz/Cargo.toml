# Harnais de fuzzing (cargo-fuzz, libFuzzer) des parseurs exposes de Bifrost.
#
# Espace de travail SEPARE du workspace racine, et c'est voulu: la section
# `[workspace]` ci-dessous en fait la racine de son propre espace. `cargo test
# --workspace`, clippy, cargo-deny et `scripts/recettes-strict.sh` lances a la
# racine du depot ne voient donc ni ce paquet ni ses dependances, et le
# `Cargo.lock` racine ne bouge pas. Ce paquet a son propre verrou,
# `fuzz/Cargo.lock`, verifie par `cargo deny` avec `fuzz/deny.toml`.
#
# Chaque cible appelle la fonction de PRODUCTION d'une crate du produit, par
# son chemin `pub`, jamais une copie. Le recensement des parseurs, leur
# frontiere de confiance et la raison de chaque cible sont dans
# `docs/07-programme-securite-produit.md`, section 2.3.
#
# Lancement: `scripts/fuzz-linux.sh` (chaine nightly et cargo-fuzz requises).

[package]
name = "bifrost-fuzz"
version = "0.0.0"
edition = "2024"
license = "MPL-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
bifrost-amorce = { path = "../crates/bifrost-amorce" }
# La bibliotheque du paquet de la CLI: ses lecteurs de fichiers et de
# declarations (voir l'en-tete de `crates/bifrost-cli/src/lib.rs`).
bifrost-cli = { path = "../crates/bifrost-cli" }
bifrost-coffre = { path = "../crates/bifrost-coffre" }
bifrost-core = { path = "../crates/bifrost-core" }
bifrost-daemon = { path = "../crates/bifrost-daemon" }
bifrost-firewall = { path = "../crates/bifrost-firewall" }
bifrost-ipc = { path = "../crates/bifrost-ipc" }
# Deja dans l'arbre du produit (memes versions que le `Cargo.lock` racine):
# serde_json et toml sont les deserialiseurs que le daemon et la CLI appellent,
# tokio porte le vrai serveur IPC de la cible `ipc_trame`.
serde_json = "1.0"
toml = "0.9"
tokio = { version = "1.53", features = ["rt", "net"] }

[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "lien_colle"
path = "fuzz_targets/lien_colle.rs"
test = false
doc = false
bench = false

