# Comptes systeme de Bifrost. Format sysusers.d(5).
#
# Declaratif et idempotent: `systemd-sysusers` cree ce qui manque et ne touche
# a rien d'autre, la ou une suite de `useradd` doit gerer elle-meme le cas ou
# le compte existe deja. Il tourne a l'installation du paquet, et de nouveau au
# demarrage, ce qui rattrape une image systeme ou les comptes auraient ete
# effaces.
#
# Trois comptes, et surtout trois ROLES qui ne doivent pas se rencontrer.

# Groupe de pilotage. Ses membres peuvent parler au daemon par son IPC, donc
# connecter et DECONNECTER. C'est l'administrateur qui y ajoute des humains:
#   usermod -aG bifrost <utilisateur>
g bifrost -

# Compte du coeur anti-censure.
#
# Le kill switch l'exempte par son UID et le daemon lance les coeurs sous lui.
# C'est le compte de code TIERS qui analyse du trafic reseau hostile, pendant
# que le daemon tourne en root: l'y confiner est la raison d'etre du compte,
# l'exemption du pare-feu n'en est que la consequence.
#
# Sans shell et sans repertoire personnel: rien ne doit pouvoir OUVRIR une
# session sous ce compte. L'exemption du kill switch lui ouvre une sortie en
# clair, etroite mais reelle, et quiconque pourrait se placer sous cette
# identite en heriterait.
#
# Il n'appartient DELIBEREMENT pas au groupe `bifrost`. L'y mettre donnerait au
# coeur le droit de piloter le daemon, donc de couper le VPN qu'il est cense
# porter: un debordement dans un parseur tiers deviendrait une deconnexion a
# distance. Aucune ligne `m` ici, et une recette le verifie.
u bifrost-coeur - "Bifrost anti-censure core" /nonexistent /usr/sbin/nologin

# Compte du resolveur chiffre embarque.
#
# Un compte DISTINCT de celui du coeur, et c'est la propriete a retenir. Les
# deux roles sont opposes: le coeur est exempte du kill switch pour sortir HORS
# du tunnel, parce qu'il EST le transport; le resolveur, lui, n'est exempte de
# rien et son trafic passe par le tunnel comme celui de tout le monde. Son UID
# ne sert qu'a le RESTREINDRE.
#
# Les reunir sous un seul compte donnerait au resolveur la sortie en clair du
# coeur. Un resolveur DNS capable d'emettre hors tunnel, c'est exactement la
# fuite que tout ce composant existe pour fermer, et elle serait invisible: le
# vecteur dns-leak resterait vert puisque la sortie serait autorisee.
#
# Meme regime que le coeur pour le reste: aucun shell, aucun repertoire
# personnel, et aucune ligne `m` vers le groupe de pilotage.
u bifrost-resolveur - "Bifrost encrypted resolver" /nonexistent /usr/sbin/nologin
