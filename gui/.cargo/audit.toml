# Exceptions de `cargo audit` pour le verrou de la coquille (`gui/Cargo.lock`).
#
# Meme forme que `.cargo/audit.toml` a la racine. Ce fichier est lu par
# `cargo audit` lance DEPUIS `gui/`: cargo-audit cherche `.cargo/audit.toml`
# et `Cargo.lock` dans le repertoire ou il tourne.
#
# `crates/bifrost-evasion/tests/avis_ignores.rs` compare cette liste a celle de
# `gui/deny.toml` et tombe si elles divergent. Ne rien ajouter ici sans
# l'ajouter aussi la-bas, ou la recette dira pourquoi.
#
# Le RAISONNEMENT (faits releves, date) vit dans `gui/deny.toml`, a cote de
# chaque entree: cargo-audit n'a pas de champ `reason`.

[advisories]
ignore = ["RUSTSEC-2024-0370", "RUSTSEC-2024-0429"]
