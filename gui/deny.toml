# La politique de cargo-deny pour la coquille (`gui/`), appliquee a son verrou
# par `cargo deny check` lance DEPUIS `gui/`, sans `--manifest-path` ni
# `--config`. cargo-deny y prend `gui/Cargo.toml`, puis cherche `deny.toml` en
# partant du dossier de ce manifeste: il lit ce fichier-ci avant celui de la
# racine.
#
# `gui/` est un espace de travail separe, avec son propre `Cargo.lock`: la pile
# de la WebView (Tauri, et sous Linux gtk-rs et WebKitGTK) n'entre pas dans le
# verrou des binaires privilegies, et le fichier racine ne la voit pas. Ce
# fichier-ci reprend la politique racine, raisons comprises (elles sont ecrites
# a la racine et ne se repetent pas ici), avec trois differences:
#
# - la liste des licences est relevee sur CE verrou: `Zlib` (foldhash,
#   zlib-rs) et `Apache-2.0 WITH LLVM-exception` (target-lexicon) y entrent;
#   `BSD-2-Clause` et `CDLA-Permissive-2.0`, qu'aucun paquet de ce verrou ne
#   demande, n'y sont pas: une licence admise qui ne sert pas n'interdit rien;
# - aucune exception LGPL: `wireguard-control` n'est pas dans ce verrou;
# - la liste des avis ignores est la sienne (voir `[advisories]`).
#
# Tout autre changement de la politique racine se reporte ici.

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
unmaintained = "all"

# `all`, comme a la racine. glib, l'avis unsound ci-dessous, est transitif
# (sous atk et gtk, sous tauri): avec le defaut `workspace`, cargo-deny ne
# l'examinerait pas, son entree ne matcherait rien, et seul cargo-audit le
# garderait.
unsound = "all"

# Un ignore perime est une ERREUR: une entree qui ne matche plus aucun crate
# de ce verrou fait rougir `cargo deny check`.
unused-ignored-advisory = "deny"

# Une liste a part de celle de la racine, parce que chaque liste ne vaut que
# pour son verrou. L'avis de la racine, RUSTSEC-2024-0436 (`paste`), n'est
# pas ici: `paste` n'est pas dans ce verrou, et `unused-ignored-advisory`
# ferait rougir son entree. Les sept avis ci-dessous n'existent, eux, que dans
# ce verrou. `gui/.cargo/audit.toml` porte les memes identifiants pour
# cargo-audit; `crates/bifrost-evasion/tests/avis_ignores.rs` tient les deux
# fichiers d'accord et exige une raison datee sur chaque entree.
#
# Les faits ci-dessous ont ete releves le 2026-10-16: `cargo tree -i <crate>`
# sur `gui/Cargo.toml` pour les deux cibles (x86_64-unknown-linux-gnu et
# x86_64-pc-windows-msvc), `cargo metadata` (genre des cibles de chaque crate
# et de ceux qui le tirent), la base RustSec, l'index de crates.io et un grep
# de notre code.
#
# RUSTSEC-2024-0370, proc-macro-error 1.0.4, non maintenu, aucune version
# corrigee. Tire par glib-macros 0.18.5 et gtk3-macros 0.18.2, deux
# proc-macros de gtk-rs 0.18: il s'execute a la construction et n'entre pas
# dans le binaire livre. Absent de l'arbre Windows.
#
# RUSTSEC-2025-0081 unic-char-property, RUSTSEC-2025-0075 unic-char-range,
# RUSTSEC-2025-0080 unic-common, RUSTSEC-2025-0100 unic-ucd-ident,
# RUSTSEC-2025-0098 unic-ucd-version, tous en 0.9.0, non maintenus (l'amont
# est archive), aucune version corrigee. Tires par urlpattern 0.3.0, sous
# tauri-utils 2.9.3, dependance normale de tauri 2.11.5: ces cinq crates sont
# dans le binaire livre, sur les deux plateformes. Ce sont des tables de
# proprietes Unicode statiques, sans reseau ni entree/sortie. tauri-utils
# 2.10.2 tire urlpattern 0.6, qui ne depend plus de `unic`: ces cinq entrees
# tomberont avec la montee de Tauri qui l'amene.
#
# RUSTSEC-2024-0429, glib 0.18.5, UNSOUND: `VariantStrIter::impl_get` passe
# une reference immuable a une fonction C qui l'ecrit; compile avec
# optimisations, l'ecriture est perdue et `next`, `nth`, `last`, `next_back`
# et `nth_back` dereferencent un pointeur nul. Corrige en glib 0.20.0, que la
# pile Linux de Tauri ne prend pas: tauri 2.12.4, la derniere version 2.x
# publiee, exige toujours gtk ^0.18 (gtk-rs 0.18, donc glib 0.18). Notre code
# n'appelle pas `VariantStrIter` (`grep -rn VariantStrIter gui/src gui/build.rs
# gui/ui crates/`: zero occurrence). glib est absent de l'arbre Windows, et la
# coquille est un processus non privilegie: elle refuse de demarrer elevee.
# Retirer cette entree fait rougir le job des dependances.
ignore = [
    { id = "RUSTSEC-2024-0370", reason = "2026-10-16: proc-macro-error 1.0.4 non maintenu, aucune version corrigee; tire seulement par deux proc-macros de gtk-rs 0.18 (glib-macros, gtk3-macros), donc execute a la construction et absent du binaire livre; Linux seulement" },
    { id = "RUSTSEC-2025-0081", reason = "2026-10-16: unic-char-property 0.9.0 non maintenu, aucune version corrigee; tables Unicode statiques tirees par urlpattern 0.3.0 sous tauri-utils 2.9.3, dans le binaire livre sur les deux plateformes" },
    { id = "RUSTSEC-2025-0075", reason = "2026-10-16: unic-char-range 0.9.0 non maintenu, aucune version corrigee; tables Unicode statiques tirees par urlpattern 0.3.0 sous tauri-utils 2.9.3, dans le binaire livre sur les deux plateformes" },
    { id = "RUSTSEC-2025-0080", reason = "2026-10-16: unic-common 0.9.0 non maintenu, aucune version corrigee; tables Unicode statiques tirees par urlpattern 0.3.0 sous tauri-utils 2.9.3, dans le binaire livre sur les deux plateformes" },
    { id = "RUSTSEC-2025-0100", reason = "2026-10-16: unic-ucd-ident 0.9.0 non maintenu, aucune version corrigee; tables Unicode statiques tirees par urlpattern 0.3.0 sous tauri-utils 2.9.3, dans le binaire livre sur les deux plateformes" },
    { id = "RUSTSEC-2025-0098", reason = "2026-10-16: unic-ucd-version 0.9.0 non maintenu, aucune version corrigee; tables Unicode statiques tirees par urlpattern 0.3.0 sous tauri-utils 2.9.3, dans le binaire livre sur les deux plateformes" },
    { id = "RUSTSEC-2024-0429", reason = "2026-10-16: glib 0.18.5 unsound (VariantStrIter, corrige en 0.20.0); tauri 2.x epingle toujours gtk-rs 0.18 (tauri 2.12.4 exige gtk ^0.18); aucune occurrence de VariantStrIter dans notre code; Linux seulement; processus non privilegie" },
]

[licenses]
# Relevee sur ce verrou (`cargo metadata`, champ `license` de chaque paquet,
# pour toutes les cibles), puis confirmee par `cargo deny check licenses`.
allow = [
    "MPL-2.0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
